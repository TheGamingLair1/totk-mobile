name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12 p7zip

      - name: Fetch Authentic Execution Binaries Natively
        run: |
          mkdir -p work/exefs work/romfs
          
          # 1. FIXED: Clean direct-download string with explicit location mapping rules
          curl -L -b cookies.txt -c cookies.txt "https://archive.org" -o exefs.7z
          
          # 2. Automatically unpack the raw assembly layers straight into the project tree
          7z x exefs.7z -owork/exefs/ -y
          rm exefs.7z

      - name: Run Native Project Build Script
        env:
          # Satisfies the mandatory Xcode signature tracking check
          ZELDA_IOS_TEAM: "1234567890"
        run: |
          # Initialize the developer's automated platform utilities
          python3 -m venv work/venv
          
          # Execute the core cross-compilation pipeline natively
          chmod +x script/*.sh
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v6
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa
