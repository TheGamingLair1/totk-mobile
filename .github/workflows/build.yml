name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Compile iOS Mobile Target Directly
        run: |
          mkdir -p build work
          # 1. FIXED: Explicitly targets the "host" folder where the main CMakeLists.txt lives!
          cmake -S host -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          
          # 2. Compiles the targeted engine app code into a standalone release package
          cmake --build build --config Release

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v4.6.0
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa
