name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Fetch and Stage Authentic Binaries
        run: |
          # 1. Create the exact nested folders the python script expects
          mkdir -p work/exefs work/romfs
          
          # 2. Force the cloud Mac to pull the raw, genuine machine code files directly from the source mirror
          curl -L "https://githubusercontent.com" -o work/exefs/main
          curl -L "https://githubusercontent.com" -o work/exefs/subsdk0
          curl -L "https://githubusercontent.com" -o work/exefs/subsdk1
          curl -L "https://githubusercontent.com" -o work/exefs/subsdk2
          curl -L "https://githubusercontent.com" -o work/exefs/sdk
          curl -L "https://githubusercontent.com.npdm" -o work/exefs/main.npdm

      - name: Run Native Project Build Script
        env:
          ZELDA_IOS_TEAM: "1234567890"
        run: |
          python3 -m venv work/venv
          chmod +x script/*.sh
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v4.6.0
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa
