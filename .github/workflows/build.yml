name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Compile iOS Mobile Target Directly
        run: |
          mkdir -p build work
          # 1. Configures the core engine files recursively for the iOS environment layout
          cmake -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          
          # 2. Compiles ONLY the binary app code into a standalone release package
          cmake --build build --config Release --target totk-mobile-ios || cmake --build build --config Release

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v6
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa
