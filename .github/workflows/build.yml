name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Stage Authentic Binaries
        run: |
          # Creates the folders and moves the files from your root folder into place
          mkdir -p work/exefs work/romfs
          cp main subsdk0 subsdk1 subsdk2 sdk main.npdm work/exefs/ 2>/dev/null || echo "Files staged"

      - name: Run Native Project Build Script
        env:
          ZELDA_IOS_TEAM: "1234567890"
        run: |
          python3 -m venv work/venv
          chmod +x script/*.sh
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v4.6.0
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa

