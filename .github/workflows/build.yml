name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Run Native Project Build Script
        env:
          ZELDA_IOS_TEAM: "1234567890"
        run: |
          # 1. Manually create the missing work/venv/ directory structure the code expects
          mkdir -p work
          python3 -m venv work/venv
          
          # 2. Grant script permissions and kick off the compilation pipeline
          chmod +x script/*.sh
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v6
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
