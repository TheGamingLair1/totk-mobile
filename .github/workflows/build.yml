name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Compile iOS Mobile Target Directly
        run: |
          # 1. FIXED: Navigate straight into the native ios directory where CMakeLists.txt lives
          cd ios
          
          # 2. Initialize the cross-compiler configuration maps
          mkdir -p build
          cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          
          # 3. Package the app files into a standalone release application bundle
          cmake --build build --config Release
