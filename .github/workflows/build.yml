name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.14

      - name: Run Native Project Build Script
        run: |
          # 1. Grants execution permission to the project's internal build scripts
          chmod +x script/*.sh
          
          # 2. Runs the developer's exact automated build rules for iOS
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v4.6.0
        with:
          name: totk-ios-app
          path: build/Release-iphoneos/*.ipa || *.ipa || ios/build/**/*.ipa
