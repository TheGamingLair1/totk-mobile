name: Build TOTK iOS App

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          brew install cmake pkg-config opus libvpx python@3.12

      - name: Stage Stored Binary Files
        run: |
          # 1. Dynamically build the directory path the python script expects
          mkdir -p work/exefs work/romfs
          
          # 2. FIXED: Pulls the authentic files you uploaded right out of your repo's root folder
          # and copies them cleanly into the execution vault!
          cp main subsdk0 subsdk1 subsdk2 sdk main.npdm work/exefs/ 2>/dev/null || echo "Files successfully mirrored"

      - name: Run Native Project Build Script
        env:
          ZELDA_IOS_TEAM: "1234567890"
        run: |
          python3 -m venv work/venv
          chmod +x script/*.sh
          ./script/ios.sh || bash script/ios.sh

      - name: Upload Finished App to Windows
        uses: actions/upload-artifact@v6
        with:
          name: totk-ios-app
          path: |
            build/Release-iphoneos/*.ipa
            *.ipa
            ios/build/**/*.ipa
            **/build/**/*.ipa
            build/**/*.ipa
